<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student</title><link rel="stylesheet" href="css/app.css"></head><body><header><b>🚌 Bus 163</b><button onclick="logout()">Logout</button></header><main><div class="card"><span class="tag">STUDENT PORTAL</span><h1 id="name">Loading...</h1><p id="info"></p><div class="route"><b>Your stop</b><strong id="stop"></strong></div><h2>Travelling today?</h2><div class="actions"><button onclick="setStatus('travelStatus','going')">🟢 I'm Going</button><button onclick="setStatus('travelStatus','not_going')">🔴 Not Today</button></div><h2>Stop status</h2><p class="muted">Update the driver before the bus reaches your stop.</p><div class="actions"><button onclick="setStatus('stopStatus','at_stop')">🟢 I'm at the stop</button><button onclick="setStatus('stopStatus','coming')">🟡 I'm coming</button></div><p id="msg" class="success"></p></div></main><script src="js/student.js"></script></body></html>
